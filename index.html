<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discovery Bank</title>

<!-- Установка на домашний экран: манифест для Android, apple-* для iOS -->
<link rel="manifest" href="app.webmanifest?v=3">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Discovery Bank">
<meta name="application-name" content="Discovery Bank">
<link rel="apple-touch-icon" href="icons/app-icon.png?v=3">
<link rel="icon" type="image/png" sizes="512x512" href="icons/app-icon.png?v=3">

<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="stage">
  <div class="device" id="device">
    <div class="phone" id="phone">

      <div class="statusbar" aria-hidden="true">
        <span class="statusbar__time" id="clock">16:51</span>
        <span class="statusbar__icons">
          <svg viewBox="0 0 24 24" class="sb-ic"><path d="M12 18.5h.01M4.5 11a10.5 10.5 0 0 1 15 0M7.7 14.3a6 6 0 0 1 8.6 0"/></svg>
          <svg viewBox="0 0 24 24" class="sb-ic"><path d="M4 17V13M9 17V10M14 17V7M19 17V4"/></svg>
          <span class="sb-batt">21</span>
        </span>
      </div>

      <header class="appbar" id="appbar"></header>

      <main class="viewport" id="viewport">
        <section class="screen" id="screen"></section>
      </main>

      <nav class="tabbar" id="tabbar"></nav>

      <!-- приватный экран: пока приложение свёрнуто, содержимое закрыто -->
      <div class="privacy" id="privacy" hidden>
        <img src="assets/brand/logo-statement.png" alt="Discovery Bank">
      </div>

      <div class="toast-layer" id="toastLayer"></div>
      <div class="sheet-layer" id="sheetLayer" hidden>
        <div class="sheet-backdrop" data-action="sheet-close"></div>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
      </div>

    </div>
  </div>

</div>

<script src="assets/icons.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>

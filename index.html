<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Meridian Bank — макет мобильного банка</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="stage">
  <div class="device" id="device">
    <div class="phone" id="phone">

      <div class="statusbar" aria-hidden="true">
        <span class="statusbar__time" id="clock">16:51</span>
        <span class="statusbar__icons">
          <svg viewBox="0 0 24 24" class="sb-ic"><path d="M12 18.5h.01M4.5 11a10.5 10.5 0 0 1 15 0M7.7 14.3a6 6 0 0 1 8.6 0"/></svg>
          <svg viewBox="0 0 24 24" class="sb-ic"><path d="M4 17V13M9 17V10M14 17V7M19 17V4"/></svg>
          <span class="sb-batt">21</span>
        </span>
      </div>

      <header class="appbar" id="appbar"></header>

      <main class="viewport" id="viewport">
        <section class="screen" id="screen"></section>
      </main>

      <nav class="tabbar" id="tabbar"></nav>

      <div class="toast-layer" id="toastLayer"></div>
      <div class="sheet-layer" id="sheetLayer" hidden>
        <div class="sheet-backdrop" data-action="sheet-close"></div>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
      </div>

    </div>
  </div>

  <p class="stage__hint">
    Демо-доступ — логин <b>thandi</b>, пароль <b>demo1234</b>
  </p>
</div>

<script src="assets/icons.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>

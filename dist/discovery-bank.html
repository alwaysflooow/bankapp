/* ---------- 1. Токены ---------------------------------------------------- */
:root{
  /* краски текста — плотные чернила, не альфы */
  --ink:        #101720;
  --ink-2:      #4B5766;
  --ink-3:      #7B8794;
  --ink-4:      #A3ACB8;

  /* поверхности и линии */
  --surface:    #FFFFFF;
  --surface-2:  #F6F7F9;
  --surface-3:  #EFF1F4;
  --line:       #E5E8EC;
  --line-2:     #D3D8DE;

  /* носители цвета */
  --magenta:      #D3168C;
  --magenta-deep: #A5136E;
  --magenta-soft: #FBEBF5;
  --navy:         #14508C;
  --navy-deep:    #0E3D6D;
  --navy-soft:    #EAF1F8;
  --link:         #1C6BB0;
  /* дебет в референсе — красный с минусом после числа; кредит остаётся
     обычными чернилами, поэтому отдельной «зелёной» краски нет */
  --debit:        #D5203C;

  /* золото на пластике */
  --gold:      #B08A57;
  --gold-soft: #C7A671;

  /* сцена «Vitality Money» */
  --bronze-1: #A9603A;
  --bronze-2: #C4804F;
  --bronze-3: #AA6539;

  /* радиусы */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-round: 999px;

  /* тени — затухание слоями, без резкой кромки */
  --sh-card:
     0 1px 1px rgba(16,23,32,.04),
     0 6px 14px -8px rgba(16,23,32,.10),
     0 20px 36px -26px rgba(16,23,32,.18);
  --sh-raise:
     0 1px 2px rgba(16,23,32,.05),
     0 10px 24px -12px rgba(16,23,32,.16),
     0 28px 50px -32px rgba(16,23,32,.22);
  --sh-sheet: 0 -14px 44px -20px rgba(16,23,32,.30);

  /* фирменная линейка */
  --rule: linear-gradient(90deg,#DD007E 0%, #A9268D 46%, #2C57A6 100%);

  --ease: cubic-bezier(.32,.72,0,1);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-doc: 'Open Sans', 'Segoe UI', Roboto, Arial, sans-serif;
}

/* ---------- 2. Сброс ----------------------------------------------------- */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font);
  color:var(--ink);
  background:#E7E9ED;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
input,select{ font:inherit; color:inherit; }
svg{ display:block; }
ul{ margin:0; padding:0; list-style:none; }
h1,h2,h3,p{ margin:0; }

/* Строчные элементы внутри кнопок ведут себя как блоки: разметка собрана
   на <span>, потому что <button> не может содержать блочные потомки. */
.acard__body,.acard__name,.acard__type,.acard__amt,.acard__lbl,
.row__body,.row__label,.row__sub,.row__meta,
.hello__name,.hello__sub,
.tx__body,.tx__name,.tx__meta,.tx__amt,
.picker__body,.picker__t,.picker__s,
.check__t,.check__s,
.summary__lbl,.summary__val,
.ring,.product__ic,.plastic__mark{ display:block; }

/* ---------- 3. Типографическая шкала ------------------------------------ */
/* чем крупнее кегль — тем легче вес */
.t-display { font-size:30px; line-height:36px; letter-spacing:-.6px; font-weight:600; }
.t-hero    { font-size:24px; line-height:30px; letter-spacing:-.4px; font-weight:600; }
.t-title   { font-size:20px; line-height:26px; letter-spacing:-.25px; font-weight:620; }
.t-section { font-size:18px; line-height:24px; letter-spacing:-.2px; font-weight:620; }
.t-row     { font-size:16px; line-height:22px; letter-spacing:-.1px; font-weight:450; }
.t-body    { font-size:15px; line-height:21px; letter-spacing:-.05px; font-weight:450; }
.t-cap     { font-size:13px; line-height:18px; letter-spacing:0;     font-weight:450; color:var(--ink-3); }
.t-micro   { font-size:11.5px;line-height:16px;letter-spacing:.1px;  font-weight:500; color:var(--ink-3); }
.num       { font-variant-numeric:tabular-nums; }

/* ---------- 4. Сцена и корпус ------------------------------------------- */
.stage{
  min-height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:22px 16px 26px;
  background:
    radial-gradient(120% 80% at 50% -10%, #F4F5F8 0%, #E7E9ED 58%, #DEE1E7 100%);
}
.stage__hint{
  font-size:12.5px; letter-spacing:.1px; color:#78818E;
}
.stage__hint b{ font-weight:600; color:#525B67; }

.device{
  width:100%; max-width:402px;
  height:min(872px, calc(100vh - 84px));
  border-radius:42px;
  background:var(--surface);
  box-shadow:
    0 0 0 10px #0F1319,
    0 0 0 11px #313842,
    0 40px 70px -34px rgba(9,13,20,.55);
  overflow:hidden;
}
.phone{
  position:relative;
  height:100%;
  display:flex; flex-direction:column;
  background:var(--surface);
  overflow:hidden;
}

@media (max-width:559px){
  .stage{ padding:0; gap:0; min-height:100dvh; }
  .device{ max-width:none; height:100dvh; border-radius:0; box-shadow:none; }
  .stage__hint{ display:none; }
}

/* Запущено с домашнего экрана: рамка телефона не нужна, статус-бар рисует
   система, снизу и сверху учитываем вырезы. */
@media (display-mode:standalone), (display-mode:fullscreen){
  .stage{ padding:0; gap:0; min-height:100dvh; background:var(--surface); }
  .device{ max-width:none; width:100%; height:100dvh; border-radius:0; box-shadow:none; }
  .stage__hint{ display:none; }
  .statusbar{ display:none; }
  .phone{ padding-top:env(safe-area-inset-top); }
  .tabbar{ padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
}

/* ---------- 5. Статус-бар ------------------------------------------------ */
/* Статус-бар — часть десктопной рамки телефона. На самом телефоне он не
   рисуется: там уже есть системный, и второй ряд времени/сети/батареи
   выглядел бы дублем. */
.statusbar{ display:none; }
@media (min-width:560px){
  .statusbar{
    flex:0 0 auto;
    height:34px; padding:0 18px 0 20px;
    display:flex; align-items:center; justify-content:space-between;
    color:var(--ink);
  }
}
.statusbar__time{ font-size:13px; font-weight:600; letter-spacing:.2px; }
.statusbar__icons{ display:flex; align-items:center; gap:6px; }
.sb-ic{ width:15px; height:15px; fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linecap:round; }
.sb-batt{
  min-width:23px; height:16px; padding:0 4px; border-radius:5px;
  background:var(--ink); color:#fff;
  font-size:10.5px; font-weight:600; line-height:16px; text-align:center;
}

/* ---------- 6. Шапка + фирменная линейка -------------------------------- */
.appbar{
  flex:0 0 auto;
  position:relative;
  background:var(--surface);
  z-index:5;
}
.appbar:empty{ display:none; }
.appbar__row{
  height:52px; padding:0 8px;
  display:grid; grid-template-columns:56px 1fr 56px; align-items:center;
}
.appbar__title{
  grid-column:2; text-align:center;
  font-size:20px; line-height:26px; letter-spacing:-.3px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.appbar__side{ display:flex; align-items:center; gap:4px; }
.appbar__side--right{ justify-content:flex-end; }
.iconbtn{
  width:44px; height:44px; border-radius:var(--r-round);
  display:grid; place-items:center; color:var(--navy);
  transition:background .16s ease;
}
.iconbtn:active{ background:var(--surface-3); }
.iconbtn svg{ width:23px; height:23px; }
.rule{ height:2px; background:var(--rule); }

/* бейдж на конверте */
.badge{
  position:absolute; top:-5px; right:-8px;
  min-width:24px; height:17px; padding:0 5px;
  border-radius:var(--r-round); background:var(--navy);
  color:#fff; font-size:10.5px; font-weight:600; line-height:17px; text-align:center;
}
.stack{ position:relative; }

/* «AI» пилюля с градиентным кольцом */
.ai-pill{
  height:32px; padding:0 12px 0 9px; border-radius:var(--r-round);
  display:flex; align-items:center; gap:7px;
  background:
    linear-gradient(var(--surface),var(--surface)) padding-box,
    var(--rule) border-box;
  border:1.5px solid transparent;
  font-size:13.5px; font-weight:600; color:var(--ink);
}
.ai-pill i{
  width:13px; height:13px; border-radius:50%;
  background:var(--rule); display:block;
}

/* ---------- 7. Область экрана и переходы -------------------------------- */
.viewport{
  position:relative;
  flex:1 1 auto;
  overflow:hidden;
}
.screen{
  position:absolute; inset:0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--surface);
  padding-bottom:16px;
}
.screen--flush{ padding-bottom:0; }

@keyframes push-in  { from{ transform:translateX(26px); opacity:0 } to{ transform:none; opacity:1 } }
@keyframes push-out { from{ transform:none; opacity:1 } to{ transform:translateX(-16px); opacity:0 } }
@keyframes pop-in   { from{ transform:translateX(-16px); opacity:0 } to{ transform:none; opacity:1 } }
@keyframes pop-out  { from{ transform:none; opacity:1 } to{ transform:translateX(26px); opacity:0 } }
@keyframes fade-in  { from{ opacity:0 } to{ opacity:1 } }
@keyframes fade-out { from{ opacity:1 } to{ opacity:0 } }

.anim-push-in { animation:push-in  .30s var(--ease) both; }
.anim-push-out,.anim-pop-out,.anim-fade-out{ pointer-events:none; }
.anim-push-out{ animation:push-out .26s var(--ease) both; }
.anim-pop-in  { animation:pop-in   .30s var(--ease) both; }
.anim-pop-out { animation:pop-out  .26s var(--ease) both; }
.anim-fade-in { animation:fade-in  .22s ease both; }
.anim-fade-out{ animation:fade-out .18s ease both; }

/* ---------- 8. Таб-бар --------------------------------------------------- */
.tabbar{
  flex:0 0 auto;
  position:relative;
  display:grid; grid-template-columns:repeat(5,1fr);
  padding:6px 2px 8px;
  background:var(--surface);
}
.tabbar:empty{ display:none; }
.tabbar::before{
  content:""; position:absolute; left:0; right:0; top:0; height:2px; background:var(--rule);
}
.tab{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:5px 2px 2px; color:var(--navy);
  transition:color .18s ease;
}
.tab svg{ width:26px; height:26px; }
.tab span{ font-size:11.5px; line-height:15px; font-weight:500; letter-spacing:-.05px; }
.tab--on{ color:var(--magenta); }
.tab:active{ opacity:.6; }

/* ---------- 9. Списки в стиле «More» ------------------------------------ */
.group{ border-top:1px solid var(--line); }
.group__head{
  padding:16px 20px 8px;
  font-size:18px; line-height:24px; font-weight:620; letter-spacing:-.2px;
}
.row{
  position:relative;
  width:100%;
  min-height:60px; padding:11px 18px 11px 20px;
  display:flex; align-items:center; gap:14px;
  text-align:left; color:var(--ink);
  transition:background .14s ease;
}
.row:active{ background:var(--surface-2); }
.row + .row::before{
  content:""; position:absolute; left:66px; right:0; top:0; height:1px; background:var(--line);
}
.row--plain + .row--plain::before{ left:20px; }
.row__ic{ flex:0 0 32px; width:32px; height:32px; display:grid; place-items:center; color:var(--magenta); }
.row__ic svg{ width:27px; height:27px; }
.row__body{ flex:1 1 auto; min-width:0; }
.row__label{ font-size:16.5px; line-height:22px; font-weight:450; letter-spacing:-.1px; }
.row__sub{ font-size:13px; line-height:18px; color:var(--ink-3); margin-top:1px; }
.row__meta{ text-align:right; font-size:15px; font-weight:500; }
.row__meta .num{ white-space:nowrap; }
.row__chev{ flex:0 0 auto; color:var(--ink-4); }
.row__chev svg{ width:20px; height:20px; }
.row--off{ color:var(--ink-4); pointer-events:none; }
.row--off .row__ic{ color:#E7C3DC; }

/* ---------- 10. Кнопки --------------------------------------------------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  text-decoration:none;
  height:50px; padding:0 20px; border-radius:var(--r-sm);
  font-size:16px; font-weight:600; letter-spacing:-.1px;
  border:1.5px solid transparent;
  transition:transform .12s var(--ease), background .16s ease, opacity .16s ease;
}
.btn:active{ transform:scale(.985); }
.btn--primary{ background:var(--navy); color:#fff; }
.btn--primary:active{ background:var(--navy-deep); }
.btn--ghost{ background:var(--surface); color:var(--navy); border-color:var(--navy); }
.btn--ghost:active{ background:var(--navy-soft); }
.btn--quiet{ background:var(--surface-2); color:var(--ink); }
.btn--wide{ width:100%; }
.btn[disabled]{ opacity:.42; pointer-events:none; }
.btn svg{ width:19px; height:19px; }

.btnrow{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* ---------- 11. Экран логина -------------------------------------------- */
.login{ display:flex; flex-direction:column; height:100%; padding:34px 22px 18px; }
.field{ position:relative; padding-top:20px; }
.field__input{
  width:100%; height:44px; padding:0 34px 6px 2px;
  border:0; border-bottom:1.5px solid var(--line-2);
  background:transparent; font-size:19px; font-weight:450; letter-spacing:-.2px;
  outline:none; transition:border-color .18s ease;
}
.field__input::placeholder{ color:var(--ink-4); }
.field__input:focus{ border-bottom-color:var(--navy); }
/* привязка к полю, а не к блоку: ниже поля живёт ссылка «Забыли пароль?» */
.field__eye{
  position:absolute; right:0; top:20px; width:36px; height:44px;
  display:grid; place-items:center; color:var(--ink-3);
}
.field__eye svg{ width:23px; height:23px; }
.field__link{
  display:block; margin:10px 0 0 auto;
  font-size:15px; font-weight:500; color:var(--link);
}
.login__spacer{ flex:1 1 auto; min-height:24px; }
.login__hint{
  margin-bottom:14px; padding:12px 14px; border-radius:var(--r-md);
  background:var(--surface-2); color:var(--ink-2);
  font-size:13px; line-height:19px;
}
.login__hint b{ color:var(--ink); font-weight:600; }

/* ---------- 12. Переключатель продуктов --------------------------------- */
.products{
  display:grid; grid-template-columns:repeat(5,1fr);
  padding:10px 6px 12px;
}
.product{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--navy); }
.product__ic{ position:relative; width:30px; height:30px; }
.product__ic svg{ width:30px; height:30px; }
.product__plus{
  position:absolute; right:-6px; top:-4px;
  width:15px; height:15px; border-radius:50%;
  background:var(--navy); color:#fff;
  display:grid; place-items:center;
}
.product__plus svg{ width:9px; height:9px; stroke-width:3; }
.product span{ font-size:11.5px; font-weight:500; }
.product--on{ color:var(--magenta); }

/* ---------- 13. Приветствие --------------------------------------------- */
.hello{ display:flex; align-items:center; gap:12px; padding:14px 20px 4px; }
.avatar{
  flex:0 0 42px; width:42px; height:42px; border-radius:50%;
  display:grid; place-items:center;
  background:var(--magenta-soft); color:var(--magenta-deep);
  font-size:15px; font-weight:620; letter-spacing:.2px;
}
.hello__name{ font-size:18px; line-height:23px; font-weight:620; letter-spacing:-.2px; }
.hello__sub{ font-size:13px; line-height:18px; color:var(--ink-3); }

/* ---------- 14. Заголовок секции на дашборде ---------------------------- */
.sechead{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 8px 20px;
}
.sechead h2{ font-size:23px; line-height:29px; letter-spacing:-.4px; font-weight:600; }
.sechead__link{ font-size:14.5px; font-weight:500; color:var(--link); }

/* ---------- 15. Карусель счетов ----------------------------------------- */
.carousel{
  display:flex; gap:12px;
  overflow-x:auto; scroll-snap-type:x mandatory;
  padding:6px 20px 18px;
  scrollbar-width:none;
}
.carousel::-webkit-scrollbar{ display:none; }
.acard{
  flex:0 0 min(318px, 86%);
  scroll-snap-align:center;
  padding:16px 16px 18px;
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:var(--sh-card);
  display:flex; gap:14px; text-align:left;
}
.acard__art{ flex:0 0 84px; }
.acard__body{ flex:1 1 auto; min-width:0; padding-top:2px; }
.acard__name{ font-size:17px; line-height:22px; font-weight:620; letter-spacing:-.2px; }
.acard__type{ font-size:12.5px; line-height:17px; color:var(--ink-3); margin-top:1px; }
.acard__amt{ margin-top:10px; font-size:21px; line-height:26px; font-weight:600; letter-spacing:-.4px; }
.acard__lbl{ font-size:12.5px; line-height:17px; color:var(--ink-3); }
.acard__amt--2{ margin-top:8px; font-size:17px; line-height:22px; font-weight:550; letter-spacing:-.2px; }
.dots{ display:flex; justify-content:center; gap:6px; padding:0 0 4px; }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--line-2); transition:background .2s ease, width .2s var(--ease); }
.dot--on{ background:var(--navy); width:18px; }

/* ---------- 16. Пластик (арт карты) ------------------------------------- */
.plastic{
  position:relative; width:84px; height:124px; border-radius:9px;
  overflow:hidden; color:#6B6255;
  box-shadow:
    0 1px 1px rgba(16,23,32,.06),
    0 6px 12px -8px rgba(16,23,32,.28);
  background:radial-gradient(120% 92% at 46% 26%, #FFFFFF 0%, #F4F2ED 52%, #E4E0D6 100%);
}
.plastic::before{
  content:""; position:absolute; inset:0;
  background:
    repeating-radial-gradient(circle at 34% 42%, rgba(150,138,116,.16) 0 1px, transparent 1px 6px),
    repeating-radial-gradient(circle at 72% 62%, rgba(150,138,116,.12) 0 1px, transparent 1px 8px);
  mix-blend-mode:multiply;
}
.plastic::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(80% 55% at 24% 8%, rgba(255,255,255,.55), transparent 62%);
}
.plastic--dark{
  color:#C9CDD4;
  background:radial-gradient(120% 92% at 46% 24%, #3B434E 0%, #262C35 56%, #171C23 100%);
}
.plastic--dark::before{
  background:
    repeating-radial-gradient(circle at 34% 42%, rgba(255,255,255,.07) 0 1px, transparent 1px 6px),
    repeating-radial-gradient(circle at 72% 62%, rgba(255,255,255,.05) 0 1px, transparent 1px 8px);
  mix-blend-mode:screen;
}
.plastic--vault{
  color:#8DA5BE;
  background:radial-gradient(120% 92% at 46% 24%, #26527F 0%, #1B3F65 56%, #14304E 100%);
}
.plastic__top{
  position:relative; display:flex; align-items:center; gap:4px; padding:9px 8px 0;
  color:var(--gold);
}
.plastic__top svg,.plastic__logo{ width:15px; height:15px; flex:0 0 15px; object-fit:contain; }
.plastic__brand b{ display:block; font-size:7.5px; line-height:8px; font-weight:600; letter-spacing:-.1px; }
.plastic__brand i{ display:block; font-style:normal; font-size:5.5px; line-height:7px; font-weight:600; }
.plastic__wave{ position:absolute; right:7px; top:9px; width:11px; height:11px; opacity:.75; }
.plastic__chip{
  position:relative; margin:11px 0 0 9px;
  width:22px; height:17px; border-radius:3px;
  background:linear-gradient(150deg,#E8D49A 0%, #C6A85F 46%, #EADCA8 100%);
  box-shadow:inset 0 0 0 .5px rgba(120,96,40,.45);
}
.plastic__chip::after{
  content:""; position:absolute; inset:3px 4px;
  border-left:.5px solid rgba(120,96,40,.5);
  border-right:.5px solid rgba(120,96,40,.5);
}
.plastic__mark{ position:relative; margin:9px auto 0; width:34px; height:34px; opacity:.9; }
.plastic__mark img{ width:100%; height:100%; object-fit:contain; }
.plastic__foot{
  position:absolute; left:0; right:0; bottom:7px;
  display:flex; align-items:baseline; justify-content:space-between; padding:0 8px;
}
.plastic__net{ font-size:11px; font-weight:700; letter-spacing:-.3px; font-style:italic; }
.plastic__tier{ font-size:6.5px; font-weight:600; letter-spacing:.3px; }

/* ---------- 17. Панель Vitality Money ----------------------------------- */
.momentum{
  margin:6px 14px 18px; padding:16px 14px 14px;
  border-radius:var(--r-lg);
  position:relative; overflow:hidden;
  background:
    radial-gradient(88% 66% at 14% 0%, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 58%),
    linear-gradient(158deg, var(--bronze-1) 0%, var(--bronze-2) 54%, var(--bronze-3) 100%);
  color:#fff;
}
.momentum__head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.momentum__title{ font-size:21px; line-height:26px; font-weight:600; letter-spacing:-.3px; }
.momentum__status{ display:flex; align-items:center; gap:2px; font-size:15px; font-weight:500; }
.momentum__status svg{ width:18px; height:18px; }
.panel{
  background:var(--surface); color:var(--ink);
  border-radius:var(--r-md); padding:13px 12px 12px;
  box-shadow:0 6px 14px -10px rgba(60,32,12,.4);
}
.panel + .panel{ margin-top:10px; }
.panel__title{ font-size:15.5px; font-weight:620; letter-spacing:-.15px; margin-bottom:11px; }

/* кольца финансовых привычек */
.behaviours{ display:grid; grid-template-columns:repeat(6,1fr); gap:2px; }
.behaviour{ display:flex; flex-direction:column; align-items:center; gap:5px; }
.ring{
  position:relative; width:44px; height:44px; border-radius:50%;
  background:conic-gradient(var(--arc,var(--navy)) calc(var(--p,0) * 1%), var(--surface-3) 0);
}
.ring::after{
  content:""; position:absolute; inset:3.5px; border-radius:50%; background:var(--surface);
}
.ring__ic{
  position:absolute; inset:0; display:grid; place-items:center; z-index:1; color:var(--ink-2);
}
.ring__ic svg{ width:20px; height:20px; }
.ring__pip{
  position:absolute; top:-1px; left:50%; transform:translateX(-50%);
  width:6px; height:6px; border-radius:50%; background:var(--arc,var(--navy)); z-index:2;
}
.behaviour span{ font-size:10.5px; line-height:14px; color:var(--ink-2); font-weight:500; }
.behaviour--on .ring__ic{ color:var(--magenta-deep); }
.behaviour--on span{ color:var(--ink); }

/* донат «Финансовый анализатор» */
.analyser{ display:flex; align-items:center; gap:16px; }
.donut{
  position:relative; flex:0 0 96px; width:96px; height:96px; border-radius:50%;
  background:conic-gradient(from -90deg, var(--navy) calc(var(--p) * 1%), var(--surface-3) 0);
}
.donut::after{
  content:""; position:absolute; inset:13px; border-radius:50%; background:var(--surface);
}
.donut__pct{
  position:absolute; z-index:1; left:50%; top:6px; transform:translateX(-50%);
  min-width:34px; padding:2px 6px; border-radius:var(--r-round);
  background:var(--surface-3); color:var(--ink-2);
  font-size:11.5px; font-weight:600; text-align:center;
}
.analyser__amt{ font-size:20px; line-height:25px; font-weight:600; letter-spacing:-.35px; }
.analyser__lbl{ font-size:13px; color:var(--ink-3); }
.legend{ margin-top:10px; display:flex; flex-direction:column; gap:5px; }
.legend__i{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); }
.legend__sw{ width:9px; height:9px; border-radius:2px; background:var(--navy); }
.legend__sw--track{ background:var(--surface-3); }

/* ---------- 18. Транзакции ---------------------------------------------- */
.searchbar{ padding:10px 20px 6px; }
.search{
  display:flex; align-items:center; gap:9px;
  height:42px; padding:0 12px; border-radius:var(--r-sm);
  background:var(--surface-2); color:var(--ink-3);
}
.search svg{ width:19px; height:19px; flex:0 0 auto; }
.search input{

  /* Мета-блок строки операции: тип, счета, категория — каждая строка отдельно,
     как в приложении-референсе. У расхода сначала «To:», у прихода — «From:». */
  function txMeta(t) {
    var acc = DB.ACCOUNTS[0].number;
    var lines = [t.type];
    var counter = t.from === acc ? t.to : t.from;
    if (counter && counter !== acc) {
      lines = lines.concat(t.amount < 0
        ? ['To: ' + counter, 'From: ' + acc]
        : ['From: ' + counter, 'To: ' + acc]);
    } else {
      lines.push(acc);
    }
    lines.push(cat(t.category).label);
    return lines.map(function (l) { return '<span class="tx__meta">' + esc(l) + '</span>'; }).join('');
  }

  function doLogin() {
    var u = $('#f-user'), p = $('#f-pass');
    if (!u.value.trim() || !p.value) { toast('Please enter your credentials to log in'); return; }
    // номер телефона сверяем по цифрам: +27 66 258 2832 и 0662582832 равнозначны
    var typed = u.value.replace(/[\s()-]/g, '');
    var expect = DB.USER.username;
    var ok = typed === expect || typed === expect.replace(/^\+27/, '0');
    if (!ok || p.value !== DB.USER.password) { toast('Incorrect username or password'); return; }
    S.authed = true;
    S.stack = [];
    save();
    resetIdle();
    go('home', {}, 'fade');
    setTimeout(function () { toast('Welcome back, ' + DB.USER.first); }, 380);

  function renderGuide() {

  /* ---------------------------------------------------------------- 11. Statements */
  function periodOf(o) {
    var t = DB.TODAY;
    if (o.period === '1m') {
      var m = new Date(t.getFullYear(), t.getMonth() - 1, 1);
      return { from: monthStart(m.getFullYear(), m.getMonth()), to: monthEnd(m.getFullYear(), m.getMonth()) };
    }
    if (o.period === '3m') {
      // именно три полных месяца, текущий неполный не берём
      var s = new Date(t.getFullYear(), t.getMonth() - 3, 1);
      var e = new Date(t.getFullYear(), t.getMonth() - 1, 1);
      return { from: monthStart(s.getFullYear(), s.getMonth()), to: monthEnd(e.getFullYear(), e.getMonth()) };
    }
    var f = o.from || monthStart(t.getFullYear(), t.getMonth());
    var e = o.to || t;
    // конец дня, чтобы операции последней даты попали в выписку
    e = new Date(e.getFullYear(), e.getMonth(), e.getDate(), 23, 59, 59);
    return { from: new Date(f.getFullYear(), f.getMonth(), f.getDate()), to: e > t ? t : e };
  }

  function periodLabel(o) {
    var p = periodOf(o);
    if (o.period === '1m') return MONTHS[p.from.getMonth()] + ' ' + p.from.getFullYear();
    if (o.period === '3m') {
      return MONTHS[p.from.getMonth()] + ' — ' + MONTHS[p.to.getMonth()] + ' ' + p.to.getFullYear();
    }
    return dShort(p.from) + ' — ' + dShort(p.to) + ' ' + p.to.getFullYear();
  }

    var n = DB.txFor(o.accountId, p.from, p.to).length;

    function check(id, on, title, sub, kind) {

        (sub ? '<span class="check__s">' + esc(sub) + '</span>' : '') + '</span></button>';
    }

        Math.min(FREE_STATEMENTS, S.requests.length) + ' of ' + FREE_STATEMENTS +
        '. Ready within 2 minutes.</div>' +

      '<div style="margin-top:18px"><button class="btn btn--primary btn--wide" data-action="submit-order">' +
        'Order statement</button></div>' +

  function submitOrder() {
    var o = S.order;
    if (!o.incl.details && !o.incl.tx && !o.incl.cats) { toast('Select at least one section'); return; }
    var p = periodOf(o);
    if (p.from > p.to) { toast('The start date is after the end date'); return; }

    var req = {
      id: 'st' + Date.now(),
      accountId: o.accountId,
      from: p.from,
      to: p.to,
      label: periodLabel(o),
      incl: JSON.parse(JSON.stringify(o.incl)),
      format: o.format,
      delivery: o.delivery,
      created: new Date(DB.TODAY),
      status: 'processing',
      ref: 'ST-' + String(Math.floor(Math.random() * 900000) + 100000)
    };
    S.requests.unshift(req);
    save();
    go('statements', {}, 'push');
    toast('Request ' + req.ref + ' received');

    setTimeout(function () {
      var r = S.requests.filter(function (x) { return x.id === req.id; })[0];
      if (!r) return;
      r.status = 'ready';
      save();
      if (S.screen === 'statements') repaint();
      toast(o.delivery === 'email' ? 'Statement sent to ' + DB.USER.emailMasked : 'Your statement is ready');
    }, 2600);
  }

  function renderStatements() {
    var reqs = S.requests.length
      ? S.requests.map(function (r) {
          var a = DB.account(r.accountId);
          var ready = r.status === 'ready';
          return '<button class="row" data-action="open-doc" data-id="' + r.id + '">' +
            '<span class="row__ic">' + icon(r.format === 'csv' ? 'docs' : 'doc') + '</span>' +
            '<span class="row__body"><span class="row__label">' + esc(a.name) + '</span>' +
              '<span class="row__sub">' + esc(r.label) + ' · ' + r.format.toUpperCase() + ' · ' + esc(r.ref) + '</span></span>' +
            '<span class="row__meta"><span class="pill' + (ready ? ' pill--ready' : '') + '">' +
              (ready ? icon('check', { w: 2.6 }) + 'Ready' : '<span class="spin">' + icon('refresh', { w: 2 }) + '</span>Processing') +
            '</span></span>' +
            '<span class="row__chev">' + icon('chevron') + '</span></button>';
        }).join('')
      : '<div class="empty">' + icon('docs') + '<p>No requests yet.<br>Order a statement and it will appear here.</p></div>';

    var quick = DB.ACCOUNTS.map(function (a) {
      return row({ icon: 'bolt', label: a.name, sub: 'Last 3 months, PDF', action: 'quick', id: a.id });
    }).join('');

    return '<div style="padding:16px 20px 4px">' +
        '<button class="btn btn--primary btn--wide" data-action="order">' + icon('plus') + 'Order a statement</button>' +
      '</div>' +
      '<div class="group" style="margin-top:12px"><div class="group__head">My requests</div>' + reqs + '</div>' +
      '<div class="group"><div class="group__head">Quick statement</div>' + quick + '</div>' +
      '<div class="note" style="margin:14px 20px 0">Statements are generated from data as at ' + dLong(DB.TODAY) +
        '. The document contains your account details, turnover and balances for the period.</div>';
  }

    var n = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function renderDoc(p) {
    var r = S.requests.filter(function (x) { return x.id === p.id; })[0];
    if (!r) return '<div class="empty"><p>Statement not found</p></div>';

    var a = DB.ACCOUNTS[0];
    var asc = DB.txFor(null, r.from, r.to).slice().reverse();
    var open = DB.openingBalanceAt(a.id, r.from);
    var close = asc.length ? asc[asc.length - 1].balanceAfter : open;
    var vat = asc.reduce(function (sum, t) { return t.category === 'fees' ? sum - t.amount : sum; }, 0);
    // номер выписки: помесячно, май 2026 — пятнадцатая
    var stNo = (r.to.getFullYear() - 2025) * 12 + (r.to.getMonth() + 1) - 2;

    var head =
      docLogo() +
      '<h1 class="st__h1">' + esc(a.name) + ' statement</h1>' +
      '<div class="st__tax">TAX INVOICE</div>' +
      '<div class="st__cols">' +
        '<div class="st__addr">' + esc(DB.USER.formal) + '<br>' +
          DB.USER.address.map(esc).join('<br>') + '</div>' +
        '<div class="st__meta">' +
          [['Statement number', String(stNo)],
           ['Statement date', dPlain(r.to)],
           ['Statement period', dPlain(r.from) + ' - ' + dPlain(r.to)],
           ['Overdraft limit', 'R0.00'],
           ['Minimum amount due', 'R0.00']].map(function (row) {
            return '<div class="st__mrow"><span>' + esc(row[0]) + '</span>' +
              '<b class="num">' + esc(row[1]) + '</b></div>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div class="st__rule"></div>';

    var summary = r.incl.details
      ? '<div class="st__h2">Your account summary</div>' +
        '<div class="st__srow"><span>Opening balance on</span><span class="num">' + dPlain(r.from) + '</span>' +
          '<span class="num st__r">' + docAmt(open) + '</span></div>' +
        '<div class="st__srow"><span>Closing balance on</span><span class="num">' + dPlain(r.to) + '</span>' +
          '<span class="num st__r">' + docAmt(close) + '</span></div>' +
        '<div class="st__acc"><b>' + esc(a.name) + '</b><b class="num">' + esc(a.number) + '</b></div>'
      : '';

    var feeMark = '<span class="st__vatmark">' + icon('seal', { w: 2 }) + '</span>';

    var rows = asc.map(function (t) {
      return '<tr>' +
        '<td class="num">' + dPlain(t.date) + '</td>' +
        '<td class="num">' + (t.card ? '***' + esc(t.card) : '') + '</td>' +
        '<td>' + esc(t.type) + '</td>' +
        '<td>' + esc(t.merchant) + '</td>' +
        '<td class="st__vatcell">' + (t.category === 'fees' ? feeMark : '') + '</td>' +
        '<td class="r num">' + docAmt(t.amount) + '</td>' +
      '</tr>';
    }).join('');

    var table = r.incl.tx
      ? '<div class="st__h2 st__h2--tt">Transaction timeline</div>' +
        '<div class="st__scroll"><table class="st__table"><thead><tr>' +
          '<th>Date</th><th>Card no.</th><th>Type</th><th>Details</th><th></th><th class="r">Amount</th>' +
        '</tr></thead><tbody>' +
          '<tr class="st__bold"><td></td><td></td><td></td><td>Opening balance</td><td></td>' +
            '<td class="r num">' + docAmt(open) + '</td></tr>' +
          rows +
          '<tr class="st__bold"><td></td><td></td><td></td><td>Closing balance</td><td></td>' +
            '<td class="r num">' + docAmt(close) + '</td></tr>' +
          '<tr class="st__vat"><td>Total VAT</td><td class="num">' +
            vat.toFixed(2) + '</td><td colspan="4">' + feeMark +
            '<span class="st__vatlbl">= fees charged (VAT incl.)</span></td></tr>' +
        '</tbody></table></div>'
      : '';

    var cats = DB.byCategory(asc);
    var maxCat = cats.length ? cats[0].total : 1;
    var catBlock = r.incl.cats && cats.length

  /* ---------------------------------------------------------------- 12b. Календарь и почта */

  /* Выбор дат выписки: месячная сетка с ограничением по доступному периоду.
     from не может быть позже to, обе даты лежат внутри истории счёта. */
  var CAL = { which: 'from', view: null };
  var WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function sameDate(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function calBounds() {
    var p = periodOf(S.order);
    return CAL.which === 'from'
      ? { min: dayStart(DB.PERIOD_START), max: dayStart(p.to) }
      : { min: dayStart(p.from), max: dayStart(DB.TODAY) };
  }

  function calendarHtml() {
    var b = calBounds();
    var v = CAL.view;
    var y = v.getFullYear(), m = v.getMonth();
    var first = new Date(y, m, 1);
    var lead = (first.getDay() + 6) % 7;              // неделя начинается с понедельника
    var days = new Date(y, m + 1, 0).getDate();
    var current = CAL.which === 'from' ? periodOf(S.order).from : periodOf(S.order).to;

    var prevOk = new Date(y, m, 0) >= b.min;
    var nextOk = new Date(y, m + 1, 1) <= b.max;

    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<span class="cal__cell"></span>';
    for (var d = 1; d <= days; d++) {
      var date = new Date(y, m, d);
      var off = date < b.min || date > b.max;
      var on = sameDate(date, dayStart(current));
      cells += '<button class="cal__cell cal__day' + (on ? ' cal__day--on' : '') + '"' +
        (off ? ' disabled' : ' data-action="cal-pick" data-id="' + y + '-' + m + '-' + d + '"') +
        '>' + d + '</button>';
    }

    return '<div class="cal">' +
      '<div class="cal__head">' +
        '<button class="cal__nav"' + (prevOk ? ' data-action="cal-prev"' : ' disabled') + '>' + icon('chevronL', { w: 2 }) + '</button>' +
        '<span class="cal__title">' + MONTHS[m] + ' ' + y + '</span>' +
        '<button class="cal__nav"' + (nextOk ? ' data-action="cal-next"' : ' disabled') + '>' + icon('chevron', { w: 2 }) + '</button>' +
      '</div>' +
      '<div class="cal__grid cal__grid--wd">' + WD.map(function (w) {
        return '<span class="cal__wd">' + w + '</span>';
      }).join('') + '</div>' +
      '<div class="cal__grid">' + cells + '</div>' +
      '<p class="cal__hint">Available history: ' + dPlain(DB.PERIOD_START) + ' — ' + dPlain(DB.TODAY) + '</p>' +
    '</div>';
  }

  function openCalendar(which) {
    CAL.which = which;
    var p = periodOf(S.order);
    var cur = which === 'from' ? p.from : p.to;
    CAL.view = new Date(cur.getFullYear(), cur.getMonth(), 1);
    openSheet(which === 'from' ? 'Statement start date' : 'Statement end date', calendarHtml());
  }

  function calShift(step) {
    CAL.view = new Date(CAL.view.getFullYear(), CAL.view.getMonth() + step, 1);
    var body = sheetEl.querySelector('.sheet__body');
    if (body) body.innerHTML = calendarHtml();
  }

  /* Письмо с выпиской: ссылка mailto отдаётся системе как есть, поэтому на
     телефоне открывается обычный выбор почтового приложения. */
  function mailtoFor(r) {
    var a = DB.ACCOUNTS[0];
    var list = DB.txFor(null, r.from, r.to);
    var tot = DB.totals(list);
    var open = DB.openingBalanceAt(a.id, r.from);
    var asc = list.slice().reverse();
    var close = asc.length ? asc[asc.length - 1].balanceAfter : open;

    var subject = DB.BANK.name + ' statement ' + r.ref;
    var body = [
      DB.BANK.name + ' — ' + a.name,
      'Account ' + a.number,
      'Statement ' + r.ref,
      'Period: ' + dPlain(r.from) + ' - ' + dPlain(r.to),
      '',
      'Opening balance: ' + docAmt(open),
      'Money in: ' + docAmt(tot.in),
      'Money out: ' + docAmt(-tot.out),
      'Closing balance: ' + docAmt(close),
      'Transactions: ' + list.length,
      '',
      'Generated in the ' + DB.BANK.name + ' app on ' + dPlain(DB.TODAY) + '.'
    ].join('\n');

    return 'mailto:' + encodeURIComponent(DB.USER.email) +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);
  }

  /* ---------------------------------------------------------------- 13. Screen registry */
  var SCREENS = {
    login:      { chrome: false, title: 'Log in', render: renderLogin, flush: true },
    home:       { tab: 'home', appbar: homeAppbar, render: renderHome },
    accounts:   { tab: 'accounts', title: 'Accounts', render: renderAccounts },
    account:    { tab: 'accounts', title: function (p) { var a = DB.account(p.id); return a ? (a.shortName || a.name) : 'Account'; }, back: true, render: renderAccount },
    transact:   { tab: 'transact', title: 'Transaction history', render: renderTransact },
    cards:      { tab: 'cards', title: 'Cards', render: renderCards },
    more:       { tab: 'more', title: 'More', render: renderMore, flush: true },
    statements: { tab: 'more', title: 'Statements', back: true, render: renderStatements },
    order:      { tab: 'more', title: 'Order a statement', back: true, render: renderOrder },
    guide:      { tab: 'more', title: 'How to use this app', back: true, render: renderGuide },
    doc:        { title: 'Statement', back: true, render: renderDoc, noTabs: true, flush: true }
  };

  var TABS = [
    { id: 'home', label: 'Home', icon: 'home' },
    { id: 'accounts', label: 'Accounts', icon: 'accounts' },
    { id: 'transact', label: 'Transact', icon: 'transact' },
    { id: 'cards', label: 'Cards', icon: 'cards' },
    { id: 'more', label: 'More', icon: 'more' }
  ];

  /* ---------------------------------------------------------------- 14. Router */
  function paintChrome() {
    var def = SCREENS[S.screen];

    if (def.appbar) {
      appbarEl.innerHTML = def.appbar();
    } else if (def.chrome === false) {
      appbarEl.innerHTML = '<div class="appbar__row"><div class="appbar__title">' +
        esc(typeof def.title === 'function' ? def.title(S.params) : def.title) + '</div></div><div class="rule"></div>';
    } else {
      var title = typeof def.title === 'function' ? def.title(S.params) : (def.title || '');
      appbarEl.innerHTML = '<div class="appbar__row">' +
        '<div class="appbar__side">' +
          (def.back ? '<button class="iconbtn" data-action="back">' + icon('chevronL', { w: 2 }) + '</button>' : '') +
        '</div>' +
        '<div class="appbar__title">' + esc(title) + '</div>' +
        '<div class="appbar__side appbar__side--right">' +
          (S.screen === 'transact' ? '<button class="iconbtn" data-action="hide">' + icon(S.hide ? 'eyeOff' : 'eye') + '</button>' : '') +
        '</div>' +
      '</div><div class="rule"></div>';
    }

    var noTabs = !S.authed || def.noTabs;
    // класс поднимает тосты над нижней панелью; на экране выписки её роль
    // играет docbar, поэтому ориентируемся только на авторизацию
    document.getElementById('phone').classList.toggle('phone--notabs', !S.authed);
    if (noTabs) {
      tabbarEl.innerHTML = '';
    } else {
      tabbarEl.innerHTML = TABS.map(function (t) {
        return '<button class="tab' + (def.tab === t.id ? ' tab--on' : '') + '" data-action="tab" data-id="' + t.id + '">' +
          icon(t.icon) + '<span>' + t.label + '</span></button>';
      }).join('');
    }
  }

  function paint(dir) {
    var def = SCREENS[S.screen];
    paintChrome();

    // страховка: в живой разметке всегда ровно один «старый» экран
    var existing = [].slice.call(viewport.querySelectorAll('.screen'));
    while (existing.length > 1) existing.shift().remove();
    var old = existing[0];

    var next = document.createElement('section');
    next.className = 'screen' + (def.flush ? ' screen--flush' : '');
    next.innerHTML = def.render(S.params);

    var inCls = dir === 'pop' ? 'anim-pop-in' : dir === 'fade' ? 'anim-fade-in' : 'anim-push-in';
    var outCls = dir === 'pop' ? 'anim-pop-out' : dir === 'fade' ? 'anim-fade-out' : 'anim-push-out';

    if (old && dir !== 'none') {
      // сбрасываем классы прошлой анимации: иначе выигрывает правило, которое
      // ниже в CSS, animationend не наступает и экран остаётся висеть слоем
      old.className = 'screen' + (old.classList.contains('screen--flush') ? ' screen--flush' : '');
      old.classList.add(outCls);
      var kill = function () { old.remove(); };
      old.addEventListener('animationend', kill);
      setTimeout(kill, 420);
      next.classList.add(inCls);
    } else if (old) {
      old.remove();
    }
    viewport.appendChild(next);
    hook(S.screen, next);
  }

  function repaint() { paint('none'); }

  function go(screen, params, dir) {
    if (dir === 'push') S.stack.push({ screen: S.screen, params: S.params });
    if (dir === 'tab' || dir === 'fade') S.stack = [];
    S.screen = screen;
    S.params = params || {};
    save();
    paint(dir === 'push' ? 'push' : dir === 'pop' ? 'pop' : dir === 'none' ? 'none' : 'fade');
  }

  function back() {
    var prev = S.stack.pop();
    if (prev) { S.screen = prev.screen; S.params = prev.params; save(); paint('pop'); }
    else go('home', {}, 'fade');
  }

  /* ---------------------------------------------------------------- 15. Post-paint hooks */
  function hook(screen, root) {
    if (screen === 'home') {
      var car = root.querySelector('#carousel'), dots = root.querySelector('#dots');
      if (car && dots) {
        car.addEventListener('scroll', function () {
          var card = car.querySelector('.acard');
          if (!card) return;
          var i = Math.round(car.scrollLeft / (card.offsetWidth + 12));
          [].forEach.call(dots.children, function (d, n) { d.classList.toggle('dot--on', n === i); });
        }, { passive: true });
      }
    }
    if (screen === 'transact') {
      var q = root.querySelector('#f-q');
      if (q) {
        // перерисовываем только ленту, чтобы не терять фокус в поле ввода
        q.addEventListener('input', function () {
          S.tx.q = q.value;
          var list = filteredTx();
          var nodes = [].slice.call(root.children);
          var start = nodes.indexOf(root.querySelector('.summary')) + 2;
          for (var i = nodes.length - 1; i >= start; i--) nodes[i].remove();
          var frag = document.createElement('div');
          frag.innerHTML = txGrouped(list);
          while (frag.firstChild) root.appendChild(frag.firstChild);
          var sum = root.querySelector('.summary'), tot = DB.totals(list);
          if (sum) {
            sum.children[0].querySelector('.summary__val').textContent = money(tot.in);
            sum.children[1].querySelector('.summary__val').textContent = money(tot.out);
          }
        });
      }
    }
    if (screen === 'doc') {
      var mail = root.querySelector('#doc-mail');
      if (mail) mail.addEventListener('click', function () { toast('Opening your email app'); });
    }
    if (screen === 'login') {
      var pass = root.querySelector('#f-pass'), user = root.querySelector('#f-user');
      if (pass) pass.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
      if (user && pass) user.addEventListener('keydown', function (e) { if (e.key === 'Enter') pass.focus(); });
    }
  }

  /* ---------------------------------------------------------------- 16. Actions */
  var ACTIONS = {
    /* — auth — */
    login: doLogin,
    'login-clear': function () { $('#f-user').value = ''; $('#f-pass').value = ''; },
    'toggle-pass': function (el) {
      var p = $('#f-pass'), show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      el.innerHTML = icon(show ? 'eyeOff' : 'eye');
    },
    forgot: function () { toast('Account recovery is not available in this demo'); },
    logout: function () {
      openSheet('Log out?',
        '<p class="t-body" style="color:var(--ink-2);margin-bottom:16px">Your session will end. The mockup data stays as it is.</p>' +
        '<div class="btnrow"><button class="btn btn--ghost" data-action="sheet-close">Stay</button>' +
        '<button class="btn btn--primary" data-action="logout-yes">Log out</button></div>');
    },
    'logout-yes': function () {
      closeSheet();
      S.authed = false;
      S.stack = [];
      save();
      go('login', {}, 'fade');
      setTimeout(function () { toast('You have been logged out'); }, 340);
    },

    /* — navigation — */
    tab: function (el) {
      var id = el.dataset.id;
      if (id === S.screen) { viewport.querySelector('.screen').scrollTo({ top: 0, behavior: 'smooth' }); return; }
      go(id, {}, 'fade');
    },
    back: back,
    account: function (el) { go('account', { id: el.dataset.id }, 'push'); },
    statements: function () { go('statements', {}, 'push'); },
    guide: function () { go('guide', {}, 'push'); },
    order: function () { S.order = S.order || defaultOrder(); go('order', {}, 'push'); },
    'order-for': function (el) {
      S.order = defaultOrder();
      S.order.accountId = el.dataset.id;
      go('order', {}, 'push');
    },
    'order-current': function () {
      S.order = defaultOrder();
      if (S.tx.month !== 'all') {
        var p = S.tx.month.split('-');
        S.order.period = 'custom';
        S.order.from = monthStart(+p[0], +p[1]);
        S.order.to = monthEnd(+p[0], +p[1]);
      }
      go('order', {}, 'push');
    },
    'history-for': function () {
      S.tx.card = 'all';
      S.tx.month = 'all';
      S.tx.q = '';
      go('transact', {}, 'fade');
    },

    /* — dashboard — */
    hide: function () { S.hide = !S.hide; save(); repaint(); },
    inbox: function () { toast('167 unread messages'); },
    assistant: function () { toast('The AI assistant is coming in a later version'); },
    product: function (el) {
      var p = PRODUCTS.filter(function (x) { return x.id === el.dataset.id; })[0];
      toast(p.on ? 'You are already in Bank' : p.label + ' is not linked to this profile yet');
    },
    momentum: function () { toast('Bronze Status · 2 more behaviours to reach Silver'); },
    behaviour: function (el) {
      var b = DB.BEHAVIOURS.filter(function (x) { return x.id === el.dataset.id; })[0];
      toast(b.label + ' — ' + b.p + '% complete');
    },
    soon: function () { toast('This section is not part of the mockup'); },
    profile: function () {
      openSheet('Profile',
        '<div class="kvlist" style="padding:0">' +
        [['Name', DB.USER.first + ' ' + DB.USER.last],
         ['Client no.', DB.USER.client],
         ['ID number', DB.USER.idMasked],
         ['Email', DB.USER.emailMasked],
         ['Mobile', DB.USER.phoneMasked],
         ['Address', DB.USER.address.join(', ')]].map(function (r) {
          return '<div class="kv"><span class="kv__k">' + r[0] + '</span><span class="kv__v">' + esc(r[1]) + '</span></div>';
        }).join('') + '</div>');
    },
    freeze: function () {
      S.frozen = !S.frozen;
      save();
      repaint();
      toast(S.frozen ? 'Card frozen' : 'Card unfrozen');
    },
    details: function (el) {
      var a = DB.account(el.dataset.id);
      openSheet('Account details',
        '<div class="kvlist" style="padding:0">' +
        [['Beneficiary', DB.USER.first + ' ' + DB.USER.last],
         ['Bank', DB.BANK.legal],
         ['Account', a.number],
         ['Type', a.type],
         ['Branch code', DB.BANK.branch],
         ['SWIFT', DB.BANK.swift]].map(function (r) {
          return '<div class="kv"><span class="kv__k">' + r[0] + '</span><span class="kv__v num">' + esc(r[1]) + '</span></div>';
        }).join('') + '</div>' +
        '<button class="btn btn--primary btn--wide" style="margin-top:16px" data-action="copy">Copy details</button>');
    },
    copy: function () { closeSheet(); toast('Account details copied'); },
    card: function (el) {
      var c = DB.CARDS.filter(function (x) { return x.last4 === el.dataset.id; })[0];
      if (!c) return;
      var used = DB.TX.filter(function (t) { return t.card === c.last4; });
      openSheet(c.name,
        '<div class="kvlist" style="padding:0">' +
        [['Card number', c.pan],
         ['Card type', c.kind],
         ['Linked account', DB.ACCOUNTS[0].number],
         ['Status', S.frozen ? 'Frozen' : 'Active'],
         ['Transactions', String(used.length)]].map(function (r) {
          return '<div class="kv"><span class="kv__k">' + r[0] + '</span><span class="kv__v num">' + esc(r[1]) + '</span></div>';
        }).join('') + '</div>' +
        '<button class="btn btn--ghost btn--wide" style="margin-top:16px" data-action="soon">Card settings</button>');
    },

    /* — history — */
    tx: function (el) { openTx(el.dataset.id); },
    proof: function () { closeSheet(); toast('Proof of payment sent by email'); },
    m: function (el) { S.tx.month = el.dataset.id; repaint(); },
    a: function (el) { S.tx.card = el.dataset.id; repaint(); },
    'filter-sheet': function () {
      openSheet('Filters',
        '<p class="t-cap" style="margin-bottom:12px">Clear the month, card and search term.</p>' +
        '<button class="btn btn--ghost btn--wide" data-action="filter-reset">Reset filters</button>');
    },
    'filter-reset': function () {
      S.tx = { q: '', month: 'all', card: 'all' };
      closeSheet();
      repaint();
      toast('Filters cleared');
    },

    /* — statement order — */
    'pick-account': function () {
      openSheet('Select an account', DB.ACCOUNTS.map(function (a) {
        return '<button class="check" role="radio" aria-checked="' + (S.order.accountId === a.id) + '" data-action="set-account" data-id="' + a.id + '">' +
          '<span class="radio"></span><span class="picker__body">' +
          '<span class="check__t">' + esc(a.name) + '</span>' +
          '<span class="check__s">' + esc(a.type) + ' · ' + esc(a.number) + '</span></span></button>';
      }).join(''));
    },
    'set-account': function (el) { S.order.accountId = el.dataset.id; closeSheet(); repaint(); },
    p: function (el) {
      S.order.period = el.dataset.id;
      if (el.dataset.id === 'custom' && !S.order.from) {
        var t = DB.TODAY;
        S.order.from = monthStart(t.getFullYear(), t.getMonth() - 1);
        S.order.to = new Date(t);
      }
      repaint();
    },
    'pick-from': function () { openCalendar('from'); },
    'pick-to': function () { openCalendar('to'); },
    'cal-prev': function () { calShift(-1); },
    'cal-next': function () { calShift(1); },
    'cal-pick': function (el) {
      var p = el.dataset.id.split('-');
      var d = new Date(+p[0], +p[1], +p[2]);
      if (CAL.which === 'from') S.order.from = d;
      else S.order.to = new Date(+p[0], +p[1], +p[2], 23, 59, 59);
      closeSheet();
      repaint();
    },
    'i-details': function () { S.order.incl.details = !S.order.incl.details; repaint(); },
    'i-tx': function () { S.order.incl.tx = !S.order.incl.tx; repaint(); },
    'i-cats': function () { S.order.incl.cats = !S.order.incl.cats; repaint(); },
    'f-pdf': function () { S.order.format = 'pdf'; repaint(); },
    'f-csv': function () { S.order.format = 'csv'; repaint(); },
    'd-email': function () { S.order.delivery = 'email'; repaint(); },
    'd-app': function () { S.order.delivery = 'app'; repaint(); },
    'submit-order': submitOrder,

    /* — statements — */
    quick: function (el) {
      var t = DB.TODAY;
      var from = monthStart(t.getFullYear(), t.getMonth() - 2);
      var req = {
        id: 'st' + Date.now(),
        accountId: el.dataset.id,
        from: from,
        to: new Date(t),
        label: dShort(from) + ' — ' + dShort(t) + ' ' + t.getFullYear(),
        incl: { details: true, tx: true, cats: true },
        format: 'pdf',
        delivery: 'app',
        created: new Date(t),
        status: 'ready',
        ref: 'ST-' + String(Math.floor(Math.random() * 900000) + 100000)
      };
      S.requests.unshift(req);
      save();
      go('doc', { id: req.id }, 'push');
    },
    'open-doc': function (el) {
      var r = S.requests.filter(function (x) { return x.id === el.dataset.id; })[0];
      if (!r) return;
      if (r.status !== 'ready') { toast('Your statement is still being prepared'); return; }
      go('doc', { id: r.id }, 'push');
    },
    print: function () { window.print(); },

    /* — sheet — */
    'sheet-close': closeSheet
  };

  /* ---------------------------------------------------------------- 16b. Автоблокировка */
  var idleTimer = null, awayAt = 0;
  var privacyEl = document.getElementById('privacy');

  function privacy(on) {
    if (privacyEl) privacyEl.hidden = !on;
  }

  function resetIdle() {
    clearTimeout(idleTimer);
    if (!S.authed) return;
    idleTimer = setTimeout(function () { lockSession('idle'); }, LOCK_IDLE * 1000);
  }

  function lockSession(reason) {
    if (!S.authed) return;
    S.authed = false;
    S.stack = [];
    clearTimeout(idleTimer);
    try { localStorage.removeItem(SEEN_KEY); } catch (e) { /* приватный режим */ }
    save();
    go('login', {}, 'fade');
    setTimeout(function () {
      toast(reason === 'idle'
        ? 'Session timed out. Please log in again.'
        : 'You left the app, so it locked. Please log in again.');
    }, 340);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      awayAt = Date.now();
      if (S.authed) { save(); privacy(true); }
      clearTimeout(idleTimer);
    } else {
      privacy(false);
      if (S.authed && awayAt && Date.now() - awayAt > LOCK_AWAY * 1000) lockSession('away');
      else resetIdle();
    }
  });

  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, resetIdle, { passive: true });
  });

  /* ---------------------------------------------------------------- 17. Delegation */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    e.preventDefault();
    fn(el, e);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheetOpen) closeSheet();
  });

  /* ---------------------------------------------------------------- 18. Boot */
  load();

  // приложение закрывали дольше, чем на LOCK_AWAY, — просим войти заново
  var lockedOnBoot = false;
  if (S.authed) {
    var seen = 0;
    try { seen = +(localStorage.getItem(SEEN_KEY) || 0); } catch (e) { /* приватный режим */ }
    if (!seen || Date.now() - seen > LOCK_AWAY * 1000) { S.authed = false; lockedOnBoot = true; }
  }

  S.order = defaultOrder();
  S.screen = S.authed ? 'home' : 'login';
  paint('none');
  resetIdle();
  if (lockedOnBoot) setTimeout(function () { toast('Session closed for your security. Please log in again.'); }, 500);

  var clock = $('#clock');
  function tick() {
    var d = new Date();
    clock.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  tick();
  setInterval(tick, 20000);
})();

</script>
